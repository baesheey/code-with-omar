<!DOCTYPE html>
<html>
    <head>
        <title>Word Formatting</title>
    </head>
    <body>
        <main>
            <p>Let's work on superscript and subscript </p>
            <p>Normal text, <sup>superscript</sup>, and <sub>subscript</sub>.</p>
            <p>This an example of superscript</p>
            <p>H <sup>22</sup></p>
            <p>This is an example of subscript</p>
            <p>CO<sub>2</sub>, H<sub>2</sub>O</p>
            <p>The alternative to the bold tag (b)</p>
            <p>Instead of using the b tag, we use the strong tag. As in <strong>I'm, watching football</strong></p>
        </main>
    </body>
</html>
